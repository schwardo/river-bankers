<?xml version="1.0" encoding="UTF-8"?>
<!-- "Flotsam" staging glyph (MOCK): three weathered driftwood sticks lashed
     into a mini raft, side-on — deliberately grayer and rougher than the
     rich-brown Logs cylinder so "not a material" reads at card size.
     Rope lashings in faded gold tie the bundle together. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 30 30">
  <!-- three stacked driftwood sticks, slightly askew -->
  <g stroke="#5c5244" stroke-width="1.1">
    <rect x="-11" y="-7.5" width="22" height="4.6" rx="2.3" fill="#a6947a" transform="rotate(-3)"/>
    <rect x="-11.5" y="-2.3" width="23" height="4.6" rx="2.3" fill="#b8a68c"/>
    <rect x="-10.5" y="2.9" width="21" height="4.6" rx="2.3" fill="#998671" transform="rotate(2.5)"/>
  </g>
  <!-- broken branch stub on the top stick -->
  <line x1="6.5" y1="-6.8" x2="9.5" y2="-10" stroke="#5c5244" stroke-width="1.4" stroke-linecap="round"/>
  <!-- two rope lashings -->
  <g fill="none" stroke="#c9a227" stroke-width="1.6">
    <path d="M -6.5 -9 L -5.2 9.2"/>
    <path d="M -5.2 -9.2 L -6.5 9"/>
    <path d="M 5.6 -9 L 6.9 9.2"/>
    <path d="M 6.9 -9.2 L 5.6 9"/>
  </g>
  <!-- lashing knots -->
  <circle cx="-5.9" cy="-8.6" r="1.1" fill="#c9a227"/>
  <circle cx="6.2" cy="-8.6" r="1.1" fill="#c9a227"/>
</svg>
